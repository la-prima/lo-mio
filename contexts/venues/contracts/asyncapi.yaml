asyncapi: 3.0.0
info:
  title: lo-mio · venues (eventos)
  version: 1.0.0
  description: Eventos que publica el contexto venues. Tópico = <ctx>.<agregado>.<hecho>.v<n>.
channels:
  tableRegistered:
    address: venues.table.registered.v1
    description: Mesa nueva con su QR. `tables` lo usa para reconocer el QR al unirse.
    messages:
      tableRegistered:
        payload: { $ref: "./openapi.yaml#/components/schemas/TableRegistered" }
  tableQrRotated:
    address: venues.table.qr-rotated.v1
    description: El QR anterior de la mesa deja de servir.
    messages:
      tableQrRotated:
        payload: { $ref: "./openapi.yaml#/components/schemas/TableQrRotated" }
operations:
  publishTableRegistered:
    action: send
    channel: { $ref: "#/channels/tableRegistered" }
  publishTableQrRotated:
    action: send
    channel: { $ref: "#/channels/tableQrRotated" }
