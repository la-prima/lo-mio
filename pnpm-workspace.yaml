packages:
  - apps/*
  - contexts/*
  - packages/*
  - tools/*
  - tests/flows

# Supply chain: no instalar versiones publicadas hace menos de 7 días
# (ventana típica en que se detectan paquetes comprometidos).
minimumReleaseAge: 10080

# Dependencias transitivas solo desde el registry (nunca git ni URLs).
blockExoticSubdeps: true

# Rechaza una versión que llegue con menos garantías de procedencia que la anterior
# (patrón típico de un paquete secuestrado).
trustPolicy: no-downgrade
# Versiones viejas de una rama anterior a la provenance de npm: no son una baja de confianza real.
# Cada una verificada (publicador e integrity) y fijada a la versión exacta.
trustPolicyExclude:
  # Parche de la rama 6 (CVE-2022-25883), lukekarrys/npm, 2023-07-10. Vía @babel/core (expo).
  - semver@6.3.1

# Scripts de instalación bloqueados salvo lista explícita.
allowBuilds:
  lefthook: true
  # Vía testcontainers; opcionales, no se necesitan compilar.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Telemetría de instalación (vía @asyncapi/parser).
  "@scarf/scarf": false

# Versiones con vulnerabilidades corregidas en dependencias transitivas (compatibles por semver).
overrides:
  # GHSA-2883-xcg3-v3hh, GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj (vía @hey-api/openapi-ts).
  "@hey-api/json-schema-ref-parser>js-yaml": ^4.3.2
  # GHSA-w5hq-g745-h8pq (vía @expo/config-plugins, prebuild de iOS). xcode solo usa
  # require("uuid").v4, que uuid 11 mantiene en CommonJS.
  "xcode>uuid": ^11.1.1
