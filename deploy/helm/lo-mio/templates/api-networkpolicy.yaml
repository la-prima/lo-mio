{{- if .Values.api.networkPolicy.enabled }}
{{- if not .Values.api.networkPolicy.databaseEgress }}
{{- fail "api.networkPolicy.databaseEgress es obligatorio: un `to` vacío permitiría salir a cualquier destino" }}
{{- end }}
# La API solo recibe tráfico de Envoy y solo sale a Postgres y al DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "lo-mio.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "lo-mio.api.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.api.networkPolicy.gatewayNamespace }}
      ports:
        - port: http
  egress:
    - to: {{- toYaml .Values.api.networkPolicy.databaseEgress | nindent 8 }}
      ports:
        - port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
