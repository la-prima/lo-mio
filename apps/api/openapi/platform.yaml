openapi: 3.1.0
info:
  title: lo-mio · plataforma
  version: 1.0.0
  description: Endpoints de plataforma (salud) y componentes comunes a todos los contextos.
# Relativo: el host depende del ambiente (local, staging, producción).
servers:
  - url: /
tags:
  - name: plataforma
    description: Salud del sistema.
paths:
  /health/live:
    get:
      operationId: getLiveness
      # Mock determinista: responde el ejemplo `ok`, o el que pida el header X-Mock-Example.
      x-microcks-operation:
        dispatcher: SCRIPT
        dispatcherRules: |
          return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
      tags: [plataforma]
      summary: El proceso responde (liveness). No consulta dependencias.
      security: []
      responses:
        "200":
          description: El proceso está vivo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              examples:
                ok:
                  value: { status: ok }
        "429": { $ref: "../../../contracts/common.yaml#/components/responses/RateLimited" }
  /health:
    get:
      operationId: getReadiness
      # Mock determinista: responde el ejemplo `ok`, o el que pida el header X-Mock-Example.
      x-microcks-operation:
        dispatcher: SCRIPT
        dispatcherRules: |
          return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
      tags: [plataforma]
      summary: Puede atender tráfico (readiness). Consulta la base de datos.
      security: []
      responses:
        "200":
          description: Listo para atender tráfico.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              examples:
                ok:
                  value: { status: ok }
        "503":
          description: Una dependencia no está disponible.
          content:
            application/problem+json:
              schema: { $ref: "../../../contracts/common.yaml#/components/schemas/Problem" }
              examples:
                dependency-unavailable:
                  value:
                    type: https://lo-mio.cl/problems/dependency-unavailable
                    title: Dependencia no disponible
                    status: 503
        "429": { $ref: "../../../contracts/common.yaml#/components/responses/RateLimited" }
components:
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
