# CA local autofirmada (cert-manager) y certificado comodín para *.lo-mio.localhost.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lo-mio-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: lo-mio local CA
  secretName: lo-mio-local-ca
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: selfsigned, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lo-mio-local-ca
spec:
  ca:
    secretName: lo-mio-local-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lo-mio-localhost
  namespace: gateway
spec:
  secretName: lo-mio-localhost-tls
  dnsNames: ["*.lo-mio.localhost", "lo-mio.localhost"]
  issuerRef: { name: lo-mio-local-ca, kind: ClusterIssuer }
