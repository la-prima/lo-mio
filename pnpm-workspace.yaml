packages:
  - apps/*
  - contexts/*
  - packages/*
  - tools/*

# Supply chain: no instalar versiones publicadas hace menos de 7 días
# (ventana típica en que se detectan paquetes comprometidos).
minimumReleaseAge: 10080

# Dependencias transitivas solo desde el registry (nunca git ni URLs).
blockExoticSubdeps: true

# Rechaza una versión que llegue con menos garantías de procedencia que la anterior
# (patrón típico de un paquete secuestrado).
trustPolicy: no-downgrade

# Scripts de instalación bloqueados salvo lista explícita.
allowBuilds:
  lefthook: true
  # Vía testcontainers; opcionales, no se necesitan compilar.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Telemetría de instalación (vía @asyncapi/parser).
  "@scarf/scarf": false

