openapi: 3.1.0
info:
  title: lo-mio · settlement
  version: 1.0.0
  description: >-
    Saldo de cada comensal: la suma de sus partes en los ítems vigentes (los pagos llegan con
    cobro-con-comprobante).
servers:
  - url: /
tags:
  - name: settlement
    description: Saldos y pagos.
x-common:
  dispatcher: &defaultExample
    dispatcher: SCRIPT
    dispatcherRules: |
      return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
paths:
  /v1/sessions/{sessionId}/balances:
    get:
      operationId: listSessionBalances
      tags: [settlement]
      summary: Saldo de cada comensal de la sesión.
      description: "Para los comensales de esa sesión o el personal del local."
      security:
        - { guestSession: [] }
        - { staffCookie: [waiter, manager, admin] }
        - { staffBearer: [waiter, manager, admin] }
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      x-microcks-operation: *defaultExample
      responses:
        "200":
          description: Un saldo por comensal (incluidos los que todavía no reclamaron nada).
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Balance" } }
              examples:
                ok:
                  value:
                    - { guestId: 0199f0a0-0000-7000-8000-0000000000f1, alias: Ana, balance: { amount: 8500, currency: CLP } }
                    - { guestId: 0199f0a0-0000-7000-8000-0000000000f2, alias: Beto, balance: { amount: 0, currency: CLP } }
        "400": { $ref: "../../../contracts/common.yaml#/components/responses/InvalidRequest" }
        "401": { $ref: "../../../contracts/common.yaml#/components/responses/Unauthenticated" }
        "404": { $ref: "../../../contracts/common.yaml#/components/responses/NotFound" }
        "429": { $ref: "../../../contracts/common.yaml#/components/responses/RateLimited" }
components:
  securitySchemes:
    staffCookie: { $ref: "../../../contracts/common.yaml#/components/securitySchemes/staffCookie" }
    staffBearer: { $ref: "../../../contracts/common.yaml#/components/securitySchemes/staffBearer" }
    guestSession: { $ref: "../../../contracts/common.yaml#/components/securitySchemes/guestSession" }
  schemas:
    Balance:
      type: object
      additionalProperties: false
      required: [guestId, alias, balance]
      properties:
        guestId: { type: string, format: uuid }
        alias: { type: string }
        balance: { $ref: "../../../contracts/common.yaml#/components/schemas/Money" }
    # Payload de settlement.balance.changed.v1.
    BalanceChanged:
      type: object
      additionalProperties: false
      required: [sessionId, guestId, balance]
      properties:
        sessionId: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        balance: { $ref: "../../../contracts/common.yaml#/components/schemas/Money" }
