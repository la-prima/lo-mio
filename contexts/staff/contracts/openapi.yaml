openapi: 3.1.0
info:
  title: lo-mio · staff
  version: 1.0.0
  description: >-
    Sesiones del personal del local (mesero, encargado, administrador). La web usa la cookie
    `lomio_staff`; la app guarda el `token` y lo envía como `Authorization: Bearer`.
servers:
  - url: /
tags:
  - name: staff
    description: Sesiones del personal.
x-common:
  dispatcher: &defaultExample
    dispatcher: SCRIPT
    dispatcherRules: |
      return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
paths:
  /v1/staff/sessions:
    post:
      operationId: createStaffSession
      tags: [staff]
      summary: Inicia sesión del personal (12 horas).
      description: >-
        Un email inexistente y una contraseña incorrecta responden igual y tardan lo mismo, para no
        revelar qué emails pertenecen al personal. Límite propio de 10 intentos por minuto por IP.
      security: []
      x-microcks-operation: *defaultExample
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
            examples: { ok: { value: { email: ana@laprima.cl, password: una-clave-larga-1 } } }
      responses:
        "201":
          description: Sesión iniciada. También se envía como cookie httpOnly `lomio_staff`.
          headers:
            Set-Cookie:
              description: "`lomio_staff=<token>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=43200`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSession" }
              examples: { ok: { $ref: "#/components/examples/StaffSession" } }
        "400": { $ref: "../../../contracts/common.yaml#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "429": { $ref: "../../../contracts/common.yaml#/components/responses/RateLimited" }
  /v1/staff/sessions/current:
    get:
      operationId: getCurrentStaffSession
      tags: [staff]
      summary: Sesión actual (para saber quién está en el dispositivo y hasta cuándo).
      security: [{ staffSession: [waiter, manager, admin] }]
      x-microcks-operation: *defaultExample
      responses:
        "200":
          description: La sesión vigente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentStaffSession" }
              examples:
                ok:
                  value:
                    expiresAt: "2026-10-21T08:00:00.000Z"
                    staff: { id: 0199f0a0-0000-7000-8000-0000000000a1, name: Ana, role: waiter, venueId: 0199f0a0-0000-7000-8000-000000000001 }
        "401": { $ref: "../../../contracts/common.yaml#/components/responses/Unauthenticated" }
        "429": { $ref: "../../../contracts/common.yaml#/components/responses/RateLimited" }
    delete:
      operationId: deleteCurrentStaffSession
      tags: [staff]
      summary: Cierra la sesión (el token deja de servir de inmediato).
      security: [{ staffSession: [waiter, manager, admin] }]
      responses:
        "204": { description: Sesión cerrada. }
        "401": { $ref: "../../../contracts/common.yaml#/components/responses/Unauthenticated" }
        "429": { $ref: "../../../contracts/common.yaml#/components/responses/RateLimited" }
components:
  securitySchemes:
    staffSession: { $ref: "../../../contracts/common.yaml#/components/securitySchemes/staffSession" }
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }
    StaffMember:
      type: object
      additionalProperties: false
      required: [id, name, role, venueId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [waiter, manager, admin] }
        venueId: { type: string, format: uuid }
    StaffSession:
      type: object
      additionalProperties: false
      required: [token, expiresAt, staff]
      properties:
        token: { type: string, description: "Para la app: enviar como `Authorization: Bearer <token>`." }
        expiresAt: { type: string, format: date-time }
        staff: { $ref: "#/components/schemas/StaffMember" }
    CurrentStaffSession:
      type: object
      additionalProperties: false
      required: [staff, expiresAt]
      properties:
        expiresAt: { type: string, format: date-time }
        staff: { $ref: "#/components/schemas/StaffMember" }
  responses:
    InvalidCredentials:
      description: Email o contraseña incorrectos (no se distingue cuál).
      content:
        application/problem+json:
          schema: { $ref: "../../../contracts/common.yaml#/components/schemas/Problem" }
          examples:
            invalid-credentials:
              value:
                type: https://lo-mio.cl/problems/invalid-credentials
                title: Email o contraseña incorrectos
                status: 401
  examples:
    StaffSession:
      value:
        token: 3q2-7wEXAMPLEtokenNOTreal0000000000000000000
        expiresAt: "2026-10-21T08:00:00.000Z"
        staff: { id: 0199f0a0-0000-7000-8000-0000000000a1, name: Ana, role: waiter, venueId: 0199f0a0-0000-7000-8000-000000000001 }
