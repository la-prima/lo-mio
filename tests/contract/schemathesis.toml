# Conformidad de la API con su contrato (apps/api/openapi.yaml). Ver tests/contract/run.sh.
base-url = "${API_URL}"
tls-verify = "${CA_BUNDLE}"

# Sesión del administrador local (tests/contract/run.sh), por esquema del contrato: así
# Schemathesis sabe qué credencial invalida al probar autenticación incorrecta.
[auth.openapi.staffCookie]
api_key = "${API_TOKEN}"

[auth.openapi.staffBearer]
bearer = "${API_TOKEN}"

# Cerraría la sesión que usa el resto de la corrida; la cubre staff-access.int.test.ts.
[[operations]]
include-operation-id = "deleteCurrentStaffSession"
enabled = false

[checks]
enabled = true

# Reusar una Idempotency-Key con otra solicitud responde 422 por contrato: es aceptación válida.
[checks.positive_data_acceptance]
expected-statuses = ["2XX", "3XX", 401, 403, 404, 409, 422, 429]

[phases.coverage]
# Todos los métodos por defecto salvo QUERY (borrador IETF): Envoy lo rechaza con 400 en HTTP/1.1
# antes de llegar a la API, que sí responde 405 (lo prueba app.int.test.ts).
unexpected-methods = ["GET", "PUT", "POST", "DELETE", "OPTIONS", "PATCH", "TRACE"]

[reports]
directory = "${REPORT_DIR}"

[reports.junit]
enabled = true

[reports.allure]
enabled = true
path = "${REPORT_DIR}/allure-results"
