name: nightly

# Matriz completa de navegadores del comensal (en cada PR corren Chromium y Pixel).
on:
  schedule:
    - cron: "0 7 * * *" # 04:00 en Chile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_MATRIX: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: deploy/ci/install-k8s-tools.sh
      - run: pnpm --filter @lo-mio/guest-web exec playwright install --with-deps chromium firefox webkit
      - run: ctlptl apply -f deploy/kind/cluster.yaml
      - run: tilt ci --timeout 25m
      - run: pnpm test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-guest-web-e2e-nightly
          path: reports/allure-results
          if-no-files-found: ignore
