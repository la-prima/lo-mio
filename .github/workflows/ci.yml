name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers usa el Docker que ya trae el runner.
      - run: pnpm test:int

  image:
    runs-on: ubuntu-latest
    env:
      TRIVY: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}:/work -w /work aquasec/trivy:0.75.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t lo-mio-api:${{ github.sha }} -f apps/api/Dockerfile .
      # Vulnerabilidades de la imagen (SO + dependencias de Node).
      - run: $TRIVY image --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1 lo-mio-api:${{ github.sha }}
      - run: $TRIVY image --quiet --format cyclonedx --output sbom-api.cdx.json lo-mio-api:${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-api.cdx.json
      # Chart: lint, esquemas de Kubernetes y malas configuraciones de seguridad.
      - run: helm lint deploy/helm/lo-mio -f deploy/helm/lo-mio/values-local.yaml
      - run: >
          helm template lo-mio deploy/helm/lo-mio -f deploy/helm/lo-mio/values-local.yaml
          | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - run: $TRIVY config --quiet --severity HIGH,CRITICAL --exit-code 1 --helm-values deploy/helm/lo-mio/values-local.yaml deploy/helm/lo-mio

  k8s-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: deploy/ci/install-k8s-tools.sh
      # Mismo clúster y mismo Tiltfile que en local; `tilt ci` termina cuando todo está listo
      # (incluida la prueba de humo por el Gateway) o falla.
      - run: ctlptl apply -f deploy/kind/cluster.yaml
      - run: tilt ci --timeout 25m
      - if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -50

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/default --config p/typescript --config p/secrets --error --metrics off

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vulnerabilidades conocidas + licencias permitidas (copyleft fuera).
      - run: >
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.0
          scan source -r /src
          --licenses="MIT,ISC,Apache-2.0,BSD-2-Clause,BSD-3-Clause,0BSD,BlueOak-1.0.0,CC0-1.0,MPL-2.0,CC-BY-4.0,Python-2.0,Unlicense"
