openapi: 3.1.0
info:
  title: lo-mio · venues
  version: 1.0.0
  description: >-
    Locales, mesas (con su QR) y catálogo de productos. Todo es del local del personal autenticado
    (`current`): ninguna operación cruza locales.
servers:
  - url: /
tags:
  - name: venues
    description: Locales, mesas y catálogo.
x-common:
  dispatcher: &defaultExample
    dispatcher: SCRIPT
    dispatcherRules: |
      return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
paths:
  /v1/venues/current:
    get:
      operationId: getCurrentVenue
      tags: [venues]
      summary: Local del personal autenticado.
      security: [{ staffCookie: [waiter, manager, admin] }, { staffBearer: [waiter, manager, admin] }]
      x-microcks-operation: *defaultExample
      responses:
        "200":
          description: El local.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
              examples: { ok: { $ref: "#/components/examples/Venue" } }
        "401": { $ref: "../../../contracts/common.yaml#/components/responses/Unauthenticated" }
        "429": { $ref: "../../../contracts/common.yaml#/components/responses/RateLimited" }
  /v1/venues/current/tables:
    get:
      operationId: listTables
      tags: [venues]
      summary: Mesas del local, con el código de su QR.
      security: [{ staffCookie: [waiter, manager, admin] }, { staffBearer: [waiter, manager, admin] }]
      x-microcks-operation: *defaultExample
      responses:
        "200":
          description: Mesas ordenadas por nombre.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Table" } }
              examples:
                ok:
                  value: [{ id: 0199f0a0-0000-7000-8000-000000000005, label: "5", qrCode: q7Kd2mN9xVb4LpW1sT8cRa }]
        "401": { $ref: "../../../contracts/common.yaml#/components/responses/Unauthenticated" }
        "429": { $ref: "../../../contracts/common.yaml#/components/responses/RateLimited" }
    post:
      operationId: registerTable
      tags: [venues]
      summary: Registra una mesa y genera su QR.
      security: [{ staffCookie: [admin] }, { staffBearer: [admin] }]
      parameters: [{ $ref: "../../../contracts/common.yaml#/components/parameters/IdempotencyKey" }]
      x-microcks-operation: *defaultExample
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTable" }
            examples: { ok: { value: { label: "5" } } }
      responses:
        "201":
          description: Mesa registrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Table" }
              examples: { ok: { $ref: "#/components/examples/Table" } }
        "400": { $ref: "../../../contracts/common.yaml#/components/responses/InvalidRequest" }
        "401": { $ref: "../../../contracts/common.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../../contracts/common.yaml#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/TableLabelTaken" }
        "422": { $ref: "#/components/responses/TableRejected" }
        "429": { $ref: "../../../contracts/common.yaml#/components/responses/RateLimited" }
  /v1/venues/current/tables/{tableId}/qr-rotation:
    post:
      operationId: rotateTableQr
      tags: [venues]
      summary: Revoca el QR de la mesa y genera uno nuevo (ej. al reimprimirlo).
      security: [{ staffCookie: [admin] }, { staffBearer: [admin] }]
      parameters:
        - { name: tableId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "../../../contracts/common.yaml#/components/parameters/IdempotencyKey" }
      x-microcks-operation: *defaultExample
      responses:
        "200":
          description: Mesa con su QR nuevo. El anterior deja de servir.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Table" }
              examples: { ok: { $ref: "#/components/examples/Table" } }
        "400": { $ref: "../../../contracts/common.yaml#/components/responses/InvalidRequest" }
        "401": { $ref: "../../../contracts/common.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../../contracts/common.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../contracts/common.yaml#/components/responses/NotFound" }
        "422": { $ref: "../../../contracts/common.yaml#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "../../../contracts/common.yaml#/components/responses/RateLimited" }
  /v1/venues/current/products:
    get:
      operationId: listProducts
      tags: [venues]
      summary: Catálogo del local (lo usa la carga manual de ítems).
      security: [{ staffCookie: [waiter, manager, admin] }, { staffBearer: [waiter, manager, admin] }]
      x-microcks-operation: *defaultExample
      responses:
        "200":
          description: Productos ordenados por nombre.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Product" } }
              examples:
                ok:
                  value:
                    - id: 0199f0a0-0000-7000-8000-000000000101
                      name: Schop Kunstmann
                      price: { amount: 4500, currency: CLP }
        "401": { $ref: "../../../contracts/common.yaml#/components/responses/Unauthenticated" }
        "429": { $ref: "../../../contracts/common.yaml#/components/responses/RateLimited" }
    post:
      operationId: registerProduct
      tags: [venues]
      summary: Agrega un producto al catálogo.
      security: [{ staffCookie: [admin] }, { staffBearer: [admin] }]
      parameters: [{ $ref: "../../../contracts/common.yaml#/components/parameters/IdempotencyKey" }]
      x-microcks-operation: *defaultExample
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewProduct" }
            examples: { ok: { value: { name: Schop Kunstmann, price: { amount: 4500, currency: CLP } } } }
      responses:
        "201":
          description: Producto registrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
              examples: { ok: { $ref: "#/components/examples/Product" } }
        "400": { $ref: "../../../contracts/common.yaml#/components/responses/InvalidRequest" }
        "401": { $ref: "../../../contracts/common.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../../contracts/common.yaml#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ProductRejected" }
        "429": { $ref: "../../../contracts/common.yaml#/components/responses/RateLimited" }
components:
  securitySchemes:
    staffCookie: { $ref: "../../../contracts/common.yaml#/components/securitySchemes/staffCookie" }
    staffBearer: { $ref: "../../../contracts/common.yaml#/components/securitySchemes/staffBearer" }
  schemas:
    Venue:
      type: object
      additionalProperties: false
      required: [id, name, country, currency]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: string, description: ISO 3166-1 alfa-2. Solo CL por ahora. }
        currency: { type: string, description: ISO 4217. Define la unidad mínima de los montos. }
    NewTable:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 20
          # Sin caracteres de control (C0/C1, rango estable entre versiones de Unicode).
          pattern: "^[^\\u0000-\\u001F\\u007F-\\u009F]+$"
          description: 'Nombre visible (ej. "5", "Terraza 2").'
    Table:
      type: object
      additionalProperties: false
      required: [id, label, qrCode]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        qrCode: { type: string, description: Código aleatorio del QR impreso. Revocable. }
    NewProduct:
      type: object
      additionalProperties: false
      required: [name, price]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, pattern: "^[^\\u0000-\\u001F\\u007F-\\u009F]+$" }
        price: { $ref: "../../../contracts/common.yaml#/components/schemas/Money" }
    Product:
      type: object
      additionalProperties: false
      required: [id, name, price]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price: { $ref: "../../../contracts/common.yaml#/components/schemas/Money" }
    # Payloads de eventos (asyncapi.yaml).
    TableRegistered:
      type: object
      additionalProperties: false
      required: [tableId, label, qrCode]
      properties:
        tableId: { type: string, format: uuid }
        label: { type: string }
        qrCode: { type: string }
    TableQrRotated:
      type: object
      additionalProperties: false
      required: [tableId, qrCode]
      properties:
        tableId: { type: string, format: uuid }
        qrCode: { type: string }
  responses:
    # 422 = el request cumple el contrato pero no una regla de negocio (400 = no cumple el contrato).
    TableRejected:
      description: Nombre de mesa inválido (ej. solo espacios) o Idempotency-Key reutilizada.
      content:
        application/problem+json:
          schema: { $ref: "../../../contracts/common.yaml#/components/schemas/Problem" }
          examples:
                invalid-table-label:
                  value:
                    type: https://lo-mio.cl/problems/invalid-table-label
                    title: Nombre de mesa inválido
                    status: 422
                idempotency-key-reused:
                  value:
                    type: https://lo-mio.cl/problems/idempotency-key-reused
                    title: Idempotency-Key reutilizada
                    status: 422
    ProductRejected:
      description: Precio en otra moneda que la del local, nombre inválido o Idempotency-Key reutilizada.
      content:
        application/problem+json:
          schema: { $ref: "../../../contracts/common.yaml#/components/schemas/Problem" }
          examples:
                currency-mismatch:
                  value:
                    type: https://lo-mio.cl/problems/currency-mismatch
                    title: El precio no está en la moneda del local
                    status: 422
                invalid-product-name:
                  value:
                    type: https://lo-mio.cl/problems/invalid-product-name
                    title: Nombre de producto inválido
                    status: 422
                idempotency-key-reused:
                  value:
                    type: https://lo-mio.cl/problems/idempotency-key-reused
                    title: Idempotency-Key reutilizada
                    status: 422
    TableLabelTaken:
      description: Ya existe una mesa con ese nombre en el local.
      content:
        application/problem+json:
          schema: { $ref: "../../../contracts/common.yaml#/components/schemas/Problem" }
          examples:
            table-label-taken:
              value:
                type: https://lo-mio.cl/problems/table-label-taken
                title: Ya existe una mesa con ese nombre
                status: 409
  examples:
    Venue:
      value: { id: 0199f0a0-0000-7000-8000-000000000001, name: Bar La Prima, country: CL, currency: CLP }
    Table:
      value: { id: 0199f0a0-0000-7000-8000-000000000005, label: "5", qrCode: q7Kd2mN9xVb4LpW1sT8cRa }
    Product:
      value:
        id: 0199f0a0-0000-7000-8000-000000000101
        name: Schop Kunstmann
        price: { amount: 4500, currency: CLP }
