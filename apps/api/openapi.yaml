# Generado por scripts/contracts.ts desde los contratos de plataforma y contextos. No editar.
openapi: 3.1.0
info:
  title: lo-mio · plataforma
  version: 1.0.0
  description: Endpoints de plataforma (salud) y componentes comunes a todos los contextos.
servers:
  - url: /
tags:
  - name: plataforma
    description: Salud del sistema.
  - name: staff
    description: Sesiones del personal.
  - name: venues
    description: Locales, mesas y catálogo.
paths:
  /health/live:
    get:
      operationId: getLiveness
      x-microcks-operation:
        dispatcher: SCRIPT
        dispatcherRules: |
          return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
      tags:
        - plataforma
      summary: El proceso responde (liveness). No consulta dependencias.
      security: []
      responses:
        "200":
          description: El proceso está vivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                ok:
                  value:
                    status: ok
        "429":
          $ref: "#/components/responses/RateLimited"
  /health:
    get:
      operationId: getReadiness
      x-microcks-operation:
        dispatcher: SCRIPT
        dispatcherRules: |
          return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
      tags:
        - plataforma
      summary: Puede atender tráfico (readiness). Consulta la base de datos.
      security: []
      responses:
        "200":
          description: Listo para atender tráfico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                ok:
                  value:
                    status: ok
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Una dependencia no está disponible.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                dependency-unavailable:
                  value:
                    type: https://lo-mio.cl/problems/dependency-unavailable
                    title: Dependencia no disponible
                    status: 503
  /v1/staff/sessions:
    post:
      operationId: createStaffSession
      tags:
        - staff
      summary: Inicia sesión del personal (12 horas).
      description: Un email inexistente y una contraseña incorrecta responden igual y
        tardan lo mismo, para no revelar qué emails pertenecen al personal.
        Límite propio de 10 intentos por minuto por IP.
      security: []
      x-microcks-operation:
        dispatcher: SCRIPT
        dispatcherRules: |
          return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
            examples:
              ok:
                value:
                  email: ana@laprima.cl
                  password: una-clave-larga-1
      responses:
        "201":
          description: Sesión iniciada. También se envía como cookie httpOnly `lomio_staff`.
          headers:
            Set-Cookie:
              description: "`lomio_staff=<token>; HttpOnly; Secure; SameSite=Lax; Path=/;
                Max-Age=43200`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSession"
              examples:
                ok:
                  $ref: "#/components/examples/StaffSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/staff/sessions/current:
    get:
      operationId: getCurrentStaffSession
      tags:
        - staff
      summary: Sesión actual (para saber quién está en el dispositivo y hasta cuándo).
      security:
        - staffCookie:
            - waiter
            - manager
            - admin
        - staffBearer:
            - waiter
            - manager
            - admin
      x-microcks-operation:
        dispatcher: SCRIPT
        dispatcherRules: |
          return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
      responses:
        "200":
          description: La sesión vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentStaffSession"
              examples:
                ok:
                  value:
                    expiresAt: 2026-10-21T08:00:00.000Z
                    staff:
                      id: 0199f0a0-0000-7000-8000-0000000000a1
                      name: Ana
                      role: waiter
                      venueId: 0199f0a0-0000-7000-8000-000000000001
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteCurrentStaffSession
      tags:
        - staff
      summary: Cierra la sesión (el token deja de servir de inmediato).
      security:
        - staffCookie:
            - waiter
            - manager
            - admin
        - staffBearer:
            - waiter
            - manager
            - admin
      responses:
        "204":
          description: Sesión cerrada.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/venues/current:
    get:
      operationId: getCurrentVenue
      tags:
        - venues
      summary: Local del personal autenticado.
      security:
        - staffCookie:
            - waiter
            - manager
            - admin
        - staffBearer:
            - waiter
            - manager
            - admin
      x-microcks-operation:
        dispatcher: SCRIPT
        dispatcherRules: |
          return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
      responses:
        "200":
          description: El local.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
              examples:
                ok:
                  $ref: "#/components/examples/Venue"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/venues/current/tables:
    get:
      operationId: listTables
      tags:
        - venues
      summary: Mesas del local, con el código de su QR.
      security:
        - staffCookie:
            - waiter
            - manager
            - admin
        - staffBearer:
            - waiter
            - manager
            - admin
      x-microcks-operation:
        dispatcher: SCRIPT
        dispatcherRules: |
          return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
      responses:
        "200":
          description: Mesas ordenadas por nombre.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Table"
              examples:
                ok:
                  value:
                    - id: 0199f0a0-0000-7000-8000-000000000005
                      label: "5"
                      qrCode: q7Kd2mN9xVb4LpW1sT8cRa
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: registerTable
      tags:
        - venues
      summary: Registra una mesa y genera su QR.
      security:
        - staffCookie:
            - admin
        - staffBearer:
            - admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      x-microcks-operation:
        dispatcher: SCRIPT
        dispatcherRules: |
          return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTable"
            examples:
              ok:
                value:
                  label: "5"
      responses:
        "201":
          description: Mesa registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
              examples:
                ok:
                  $ref: "#/components/examples/Table"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/TableLabelTaken"
        "422":
          $ref: "#/components/responses/TableRejected"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/venues/current/tables/{tableId}/qr-rotation:
    post:
      operationId: rotateTableQr
      tags:
        - venues
      summary: Revoca el QR de la mesa y genera uno nuevo (ej. al reimprimirlo).
      security:
        - staffCookie:
            - admin
        - staffBearer:
            - admin
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      x-microcks-operation:
        dispatcher: SCRIPT
        dispatcherRules: |
          return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
      responses:
        "200":
          description: Mesa con su QR nuevo. El anterior deja de servir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
              examples:
                ok:
                  $ref: "#/components/examples/Table"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/venues/current/products:
    get:
      operationId: listProducts
      tags:
        - venues
      summary: Catálogo del local (lo usa la carga manual de ítems).
      security:
        - staffCookie:
            - waiter
            - manager
            - admin
        - staffBearer:
            - waiter
            - manager
            - admin
      x-microcks-operation:
        dispatcher: SCRIPT
        dispatcherRules: |
          return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
      responses:
        "200":
          description: Productos ordenados por nombre.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
              examples:
                ok:
                  value:
                    - id: 0199f0a0-0000-7000-8000-000000000101
                      name: Schop Kunstmann
                      price:
                        amount: 4500
                        currency: CLP
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: registerProduct
      tags:
        - venues
      summary: Agrega un producto al catálogo.
      security:
        - staffCookie:
            - admin
        - staffBearer:
            - admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      x-microcks-operation:
        dispatcher: SCRIPT
        dispatcherRules: |
          return mockRequest.getRequest().getHeader("X-Mock-Example") ?: "ok"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProduct"
            examples:
              ok:
                value:
                  name: Schop Kunstmann
                  price:
                    amount: 4500
                    currency: CLP
      responses:
        "201":
          description: Producto registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              examples:
                ok:
                  $ref: "#/components/examples/Product"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ProductRejected"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: Identificador del tipo de problema.
        title:
          type: string
          description: Resumen legible, igual para todas las ocurrencias del tipo.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Explicación de esta ocurrencia.
        instance:
          type: string
          description: Identificador de esta ocurrencia.
    Credentials:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200
    StaffMember:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - role
        - venueId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum:
            - waiter
            - manager
            - admin
        venueId:
          type: string
          format: uuid
    StaffSession:
      type: object
      additionalProperties: false
      required:
        - token
        - expiresAt
        - staff
      properties:
        token:
          type: string
          description: "Para la app: enviar como `Authorization: Bearer <token>`."
        expiresAt:
          type: string
          format: date-time
        staff:
          $ref: "#/components/schemas/StaffMember"
    CurrentStaffSession:
      type: object
      additionalProperties: false
      required:
        - staff
        - expiresAt
      properties:
        expiresAt:
          type: string
          format: date-time
        staff:
          $ref: "#/components/schemas/StaffMember"
    Venue:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - country
        - currency
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        country:
          type: string
          description: ISO 3166-1 alfa-2. Solo CL por ahora.
        currency:
          type: string
          description: ISO 4217. Define la unidad mínima de los montos.
    NewTable:
      type: object
      additionalProperties: false
      required:
        - label
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[^\u0000-\u001F\u007F-\u009F]+$
          description: Nombre visible (ej. "5", "Terraza 2").
    Table:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - qrCode
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        qrCode:
          type: string
          description: Código aleatorio del QR impreso. Revocable.
    NewProduct:
      type: object
      additionalProperties: false
      required:
        - name
        - price
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[^\u0000-\u001F\u007F-\u009F]+$
        price:
          $ref: "#/components/schemas/Money"
    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - price
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
    TableRegistered:
      type: object
      additionalProperties: false
      required:
        - tableId
        - label
        - qrCode
      properties:
        tableId:
          type: string
          format: uuid
        label:
          type: string
        qrCode:
          type: string
    TableQrRotated:
      type: object
      additionalProperties: false
      required:
        - tableId
        - qrCode
      properties:
        tableId:
          type: string
          format: uuid
        qrCode:
          type: string
    Money:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          minimum: 0
          maximum: 1000000000000
          description: Tope de un billón de unidades mínimas.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
  responses:
    RateLimited:
      description: Se superó el límite de solicitudes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            rate-limited:
              value:
                type: https://lo-mio.cl/problems/rate-limited
                title: Demasiadas solicitudes
                status: 429
    InvalidCredentials:
      description: Email o contraseña incorrectos (no se distingue cuál).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalid-credentials:
              value:
                type: https://lo-mio.cl/problems/invalid-credentials
                title: Email o contraseña incorrectos
                status: 401
    InvalidRequest:
      description: La solicitud no cumple el contrato.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalid-request:
              value:
                type: https://lo-mio.cl/problems/invalid-request
                title: Solicitud inválida
                status: 400
    Unauthenticated:
      description: Falta la sesión o no es válida.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unauthenticated:
              value:
                type: https://lo-mio.cl/problems/unauthenticated
                title: Sesión requerida
                status: 401
    TableRejected:
      description: Nombre de mesa inválido (ej. solo espacios) o Idempotency-Key
        reutilizada.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalid-table-label:
              value:
                type: https://lo-mio.cl/problems/invalid-table-label
                title: Nombre de mesa inválido
                status: 422
            idempotency-key-reused:
              value:
                type: https://lo-mio.cl/problems/idempotency-key-reused
                title: Idempotency-Key reutilizada
                status: 422
    ProductRejected:
      description: Precio en otra moneda que la del local, nombre inválido o
        Idempotency-Key reutilizada.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            currency-mismatch:
              value:
                type: https://lo-mio.cl/problems/currency-mismatch
                title: El precio no está en la moneda del local
                status: 422
            invalid-product-name:
              value:
                type: https://lo-mio.cl/problems/invalid-product-name
                title: Nombre de producto inválido
                status: 422
            idempotency-key-reused:
              value:
                type: https://lo-mio.cl/problems/idempotency-key-reused
                title: Idempotency-Key reutilizada
                status: 422
    TableLabelTaken:
      description: Ya existe una mesa con ese nombre en el local.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            table-label-taken:
              value:
                type: https://lo-mio.cl/problems/table-label-taken
                title: Ya existe una mesa con ese nombre
                status: 409
    Forbidden:
      description: La sesión no tiene permiso para esta operación.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            forbidden:
              value:
                type: https://lo-mio.cl/problems/forbidden
                title: Sin permiso
                status: 403
    NotFound:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            not-found:
              value:
                type: https://lo-mio.cl/problems/not-found
                title: Recurso no encontrado
                status: 404
    IdempotencyKeyReused:
      description: La misma Idempotency-Key se usó con otra solicitud.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            idempotency-key-reused:
              value:
                type: https://lo-mio.cl/problems/idempotency-key-reused
                title: Idempotency-Key reutilizada
                status: 422
  securitySchemes:
    staffCookie:
      type: apiKey
      in: cookie
      name: lomio_staff
      description: Sesión del personal en la web (cookie httpOnly).
    staffBearer:
      type: http
      scheme: bearer
      description: "Sesión del personal en la app (`Authorization: Bearer <token>`)."
  examples:
    StaffSession:
      value:
        token: 3q2-7wEXAMPLEtokenNOTreal0000000000000000000
        expiresAt: 2026-10-21T08:00:00.000Z
        staff:
          id: 0199f0a0-0000-7000-8000-0000000000a1
          name: Ana
          role: waiter
          venueId: 0199f0a0-0000-7000-8000-000000000001
    Venue:
      value:
        id: 0199f0a0-0000-7000-8000-000000000001
        name: Bar La Prima
        country: CL
        currency: CLP
    Table:
      value:
        id: 0199f0a0-0000-7000-8000-000000000005
        label: "5"
        qrCode: q7Kd2mN9xVb4LpW1sT8cRa
    Product:
      value:
        id: 0199f0a0-0000-7000-8000-000000000101
        name: Schop Kunstmann
        price:
          amount: 4500
          currency: CLP
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Identificador único del comando (UUIDv7). Reintentar con la misma
        clave no lo aplica dos veces.
      schema:
        type: string
        format: uuid
